<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  color: #e2e8f0;
  background: #070b18;
  font-family: system-ui, sans-serif;
}

.wrap {
  max-width: 480px;
  margin: auto;
  padding: 8px;
}

.hud {
  display: flex;
  justify-content: space-between;
  padding: 12px 0;
  font-size: 14px;
  font-weight: 800;
}

.arena {
  position: relative;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  background: #0c132b;
  border: 2px solid #334155;
  border-radius: 14px;
  touch-action: none;
}

#overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 24px;
  text-align: center;
  background: rgba(5, 9, 23, .9);
  border-radius: 14px;
}

#overlay.hidden { display: none; }

h2 {
  color: #67e8f9;
  margin: 8px 0;
}

p {
  line-height: 1.6;
  font-size: 14px;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 15px 10px;
  font: bold 16px system-ui;
  background: #67e8f9;
  color: #083344;
  cursor: pointer;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

.controls {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.direction {
  flex: 1;
  background: #c4b5fd;
  color: #2e1065;
}

#hook {
  flex: 2;
}

#pause {
  width: 100%;
  margin-top: 8px;
  background: #263249;
  color: #e2e8f0;
  padding: 10px;
}

#status {
  color: #a5f3fc;
  min-height: 40px;
  text-align: center;
  padding-top: 10px;
  font-size: 13px;
}

small {
  display: block;
  color: #94a3b8;
  line-height: 1.6;
}
</style>
</head>

<body>
<div class="wrap">
  <div class="hud">
    <span id="height">Height: 0 m</span>
    <span id="orbs">Orbs: 0</span>
    <span id="progress">0%</span>
  </div>

  <div class="arena">
    <canvas id="game" width="480" height="600"
      tabindex="0" aria-label="Grapple Escape arena"></canvas>

    <div id="overlay">
      <h2 id="title">GRAPPLE ESCAPE</h2>
      <p id="message"></p>
      <button id="action">Start escape</button>
    </div>
  </div>

  <div class="controls">
    <button class="direction" id="left">◀</button>
    <button id="hook">🪝 HOOK</button>
    <button class="direction" id="right">▶</button>
  </div>

  <button id="pause">Pause</button>
  <div id="status"></div>

  <small>
    Tap HOOK to attach to the highlighted anchor.
    Your rope automatically reels you upward.<br>
    Hold ◀ or ▶ to swing. Tap RELEASE, then HOOK again to climb.<br>
    You can also tap the arena to hook or release.<br>
    Keyboard: A/D or arrows to steer, Space to hook, P to pause.
  </small>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);
const canvas = $("game");
const ctx = canvas.getContext("2d");

const W = 480;
const H = 600;
const START_Y = 485;
const FINISH_Y = -2200;
const REACH = 310;

let state = "ready";
let player;
let anchors = [];
let orbs = [];
let particles = [];
let rope = null;

let camera = 0;
let lava = 665;
let elapsed = 0;
let collected = 0;
let highest = START_Y;
let notice = "";
let noticeTime = 0;

const keyboard = new Set();
const leftTouches = new Set();
const rightTouches = new Set();

function clearInput() {
  keyboard.clear();
  leftTouches.clear();
  rightTouches.clear();
}

function panel(title, message, label, action) {
  $("title").textContent = title;
  $("message").textContent = message;
  $("action").textContent = label;
  $("action").onclick = action;
  $("overlay").classList.remove("hidden");
}

function random(min, max) {
  return min + Math.random() * (max - min);
}

function generateTower() {
  anchors = [];
  orbs = [];

  let x = 250;
  let y = 325;

  while (y > FINISH_Y - 100) {
    anchors.push({x, y});

    orbs.push({
      x: x + random(-24, 24),
      y: y + 60,
      taken: false
    });

    // Nearby anchors with limited horizontal separation.
    x = Math.max(85, Math.min(W - 85, x + random(-140, 140)));
    y -= random(125, 155);
  }
}

function start() {
  generateTower();

  player = {
    x: W / 2,
    y: START_Y,
    vx: 0,
    vy: 0,
    r: 13
  };

  rope = null;
  particles = [];
  camera = 0;
  lava = 665;
  elapsed = 0;
  collected = 0;
  highest = START_Y;
  notice = "";
  noticeTime = 0;

  clearInput();
  state = "playing";

  $("overlay").classList.add("hidden");
  $("pause").textContent = "Pause";

  hud();
}

function candidate() {
  if (!player) return null;

  let best = null;
  let bestScore = Infinity;

  for (const anchor of anchors) {
    const dx = anchor.x - player.x;
    const dy = anchor.y - player.y;
    const distance = Math.hypot(dx, dy);

    // Only hook anchors meaningfully above the player.
    if (dy > -35 || distance > REACH) continue;

    const score = distance + Math.abs(dx) * 0.15;

    if (score < bestScore) {
      best = anchor;
      bestScore = score;
    }
  }

  return best;
}

function hook() {
  if (state !== "playing") return;

  if (rope) {
    rope = null;
    return;
  }

  const anchor = candidate();

  if (!anchor) {
    notice = "No anchor above you is within reach!";
    noticeTime = 1.5;
    return;
  }

  rope = {
    anchor,
    length: Math.hypot(
      anchor.x - player.x,
      anchor.y - player.y
    )
  };

  burst(anchor.x, anchor.y, "#67e8f9", 10);
}

function burst(x, y, color, count = 18) {
  for (let i = 0; i < count; i++) {
    const angle = random(0, Math.PI * 2);
    const speed = random(35, 150);

    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.6,
      color
    });
  }
}

function lose(reason) {
  if (state !== "playing") return;

  state = "over";
  clearInput();

  const height = Math.floor((START_Y - highest) / 10);

  panel(
    "ESCAPE FAILED",
    reason + " Height: " + height + " m. Orbs: " + collected + ".",
    "Try a new tower",
    start
  );
}

function win() {
  state = "won";
  clearInput();

  panel(
    "YOU ESCAPED!",
    "You climbed the tower in " + elapsed.toFixed(1) +
      " seconds and collected " + collected + " orbs!",
    "Escape another tower",
    start
  );
}

function pause() {
  if (state === "playing") {
    state = "paused";
    clearInput();
    $("pause").textContent = "Resume";

    panel(
      "PAUSED",
      "The lava is paused too.",
      "Resume",
      pause
    );
  } else if (state === "paused") {
    state = "playing";
    $("pause").textContent = "Pause";
    $("overlay").classList.add("hidden");
  }
}

function hud() {
  if (!player) return;

  const height = Math.max(
    0,
    Math.floor((START_Y - highest) / 10)
  );

  const percent = Math.max(
    0,
    Math.min(
      100,
      Math.floor(
        (START_Y - highest) /
        (START_Y - FINISH_Y) * 100
      )
    )
  );

  $("height").textContent = "Height: " + height + " m";
  $("orbs").textContent = "Orbs: " + collected;
  $("progress").textContent = percent + "%";

  $("hook").textContent = rope ? "✂ RELEASE" : "🪝 HOOK";

  if (noticeTime > 0) {
    $("status").textContent = notice;
  } else if (rope) {
    $("status").textContent =
      "Reeling upward! Release and hook again for the next anchor.";
  } else if (candidate()) {
    $("status").textContent =
      "Anchor in reach — tap HOOK!";
  } else {
    $("status").textContent =
      "Steer toward an anchor above you.";
  }
}

function update(dt) {
  if (state === "paused") return;

  for (const p of particles) {
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }

  particles = particles.filter(p => p.life > 0);

  if (state !== "playing") return;

  elapsed += dt;
  noticeTime = Math.max(0, noticeTime - dt);

  const left =
    leftTouches.size > 0 ||
    keyboard.has("ArrowLeft") ||
    keyboard.has("a");

  const right =
    rightTouches.size > 0 ||
    keyboard.has("ArrowRight") ||
    keyboard.has("d");

  const steering = Number(right) - Number(left);

  player.vx += steering * 650 * dt;
  player.vx *= Math.exp(-0.7 * dt);
  player.vx = Math.max(-320, Math.min(320, player.vx));

  player.vy += 650 * dt;
  player.vy = Math.min(580, player.vy);

  player.x += player.vx * dt;
  player.y += player.vy * dt;

  if (rope) {
    // Shorten the rope, pulling the player toward the anchor.
    const previousLength = rope.length;
    rope.length = Math.max(60, rope.length - 145 * dt);

    const reelVelocity = (rope.length - previousLength) / dt;

    const dx = player.x - rope.anchor.x;
    const dy = player.y - rope.anchor.y;
    const distance = Math.hypot(dx, dy) || 1;

    if (distance >= rope.length) {
      const nx = dx / distance;
      const ny = dy / distance;

      player.x = rope.anchor.x + nx * rope.length;
      player.y = rope.anchor.y + ny * rope.length;

      // Preserve sideways swing while constraining outward motion.
      const radialVelocity = player.vx * nx + player.vy * ny;

      if (radialVelocity > reelVelocity) {
        player.vx -= (radialVelocity - reelVelocity) * nx;
        player.vy -= (radialVelocity - reelVelocity) * ny;
      }
    }
  }

  // Tower walls bounce the player gently.
  if (player.x < 20) {
    player.x = 20;
    player.vx = Math.abs(player.vx) * 0.35;
  }

  if (player.x > W - 20) {
    player.x = W - 20;
    player.vx = -Math.abs(player.vx) * 0.35;
  }

  // Starting platform.
  if (player.y + player.r > 510) {
    player.y = 510 - player.r;
    player.vy = Math.min(0, player.vy);
  }

  highest = Math.min(highest, player.y);

  // Camera follows upward progress, not every small bounce.
  const targetCamera = Math.min(0, highest - 290);
  camera += (targetCamera - camera) *
    Math.min(1, dt * 8);

  // Lava rises continuously and gradually accelerates.
  lava -= Math.min(65, 32 + elapsed * 0.45) * dt;

  for (const orb of orbs) {
    if (
      !orb.taken &&
      Math.hypot(orb.x - player.x, orb.y - player.y) < 25
    ) {
      orb.taken = true;
      collected += 1;
      burst(orb.x, orb.y, "#facc15");
    }
  }

  if (player.y + player.r >= lava) {
    lose("The lava caught you!");
    return;
  }

  if (player.y - camera > H + 80) {
    lose("You fell too far down the tower!");
    return;
  }

  if (player.y <= FINISH_Y) {
    win();
  }
}

function circle(x, y, radius, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  const gridOffset = ((-camera) % 50 + 50) % 50;

  ctx.strokeStyle = "#182441";
  ctx.lineWidth = 1;

  for (let x = 0; x <= W; x += 48) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }

  for (let y = gridOffset; y < H; y += 50) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  ctx.fillStyle = "#1d2945";
  ctx.fillRect(0, 0, 10, H);
  ctx.fillRect(W - 10, 0, 10, H);

  if (!player) return;

  const py = player.y - camera;
  const selected = rope ? null : candidate();

  // Starting ledge.
  const floorY = 510 - camera;

  if (floorY < H) {
    ctx.fillStyle = "#334155";
    ctx.fillRect(10, floorY, W - 20, 18);

    ctx.fillStyle = "#94a3b8";
    ctx.fillRect(10, floorY, W - 20, 3);
  }

  // Exit portal.
  const exitY = FINISH_Y - camera;

  if (exitY > -90 && exitY < H + 90) {
    ctx.save();

    ctx.strokeStyle = "#86efac";
    ctx.shadowColor = "#86efac";
    ctx.shadowBlur = 20;
    ctx.lineWidth = 5;

    ctx.beginPath();
    ctx.ellipse(W / 2, exitY, 155, 45, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();

    ctx.fillStyle = "#86efac";
    ctx.font = "bold 20px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("ESCAPE", W / 2, exitY - 55);
  }

  for (const anchor of anchors) {
    const y = anchor.y - camera;

    if (y < -30 || y > H + 30) continue;

    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(anchor.x, y);
    ctx.lineTo(
      anchor.x < W / 2 ? 10 : W - 10,
      y - 20
    );
    ctx.stroke();

    const highlighted = anchor === selected ||
      (rope && rope.anchor === anchor);

    circle(
      anchor.x,
      y,
      highlighted ? 10 : 7,
      highlighted ? "#67e8f9" : "#64748b"
    );

    if (highlighted) {
      ctx.strokeStyle = "#a5f3fc";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(anchor.x, y, 17, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // Aim guide for the next anchor.
  if (selected && state === "playing") {
    ctx.save();
    ctx.setLineDash([5, 8]);
    ctx.strokeStyle = "rgba(103,232,249,.4)";
    ctx.beginPath();
    ctx.moveTo(player.x, py);
    ctx.lineTo(selected.x, selected.y - camera);
    ctx.stroke();
    ctx.restore();
  }

  for (const orb of orbs) {
    const y = orb.y - camera;

    if (orb.taken || y < -20 || y > H + 20) continue;

    ctx.save();
    ctx.shadowColor = "#facc15";
    ctx.shadowBlur = 12;
    circle(orb.x, y, 7, "#facc15");
    ctx.restore();
  }

  if (rope) {
    ctx.strokeStyle = "#67e8f9";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(player.x, py);
    ctx.lineTo(
      rope.anchor.x,
      rope.anchor.y - camera
    );
    ctx.stroke();
  }

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 0.6);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y - camera, 4, 4);
  }

  ctx.globalAlpha = 1;

  if (state !== "over") {
    ctx.save();
    ctx.translate(player.x, py);
    ctx.rotate(player.vx / 1000);

    ctx.shadowColor = "#c4b5fd";
    ctx.shadowBlur = 18;

    ctx.fillStyle = "#c4b5fd";
    ctx.fillRect(-12, -13, 24, 26);

    ctx.shadowBlur = 0;
    ctx.fillStyle = "#312e81";
    ctx.fillRect(-7, -6, 14, 7);

    ctx.fillStyle = "#67e8f9";
    ctx.fillRect(-5, -4, 10, 3);

    ctx.restore();
  }

  // Rising lava.
  const lavaY = lava - camera;

  if (lavaY < H) {
    const startY = Math.max(-20, lavaY);

    ctx.fillStyle = "#dc2626";
    ctx.fillRect(0, startY, W, H - startY);

    ctx.fillStyle = "#fb923c";
    ctx.beginPath();
    ctx.moveTo(0, startY + 12);

    for (let x = 0; x <= W; x += 8) {
      const wave = Math.sin(x * 0.04 + elapsed * 5) * 5;
      ctx.lineTo(x, lavaY + wave);
    }

    ctx.lineTo(W, startY + 22);
    ctx.lineTo(0, startY + 22);
    ctx.closePath();
    ctx.fill();
  }

  // Lava distance indicator.
  if (state === "playing") {
    const gap = Math.max(
      0,
      Math.floor((lava - player.y) / 10)
    );

    ctx.fillStyle = gap < 20 ? "#fb923c" : "#94a3b8";
    ctx.textAlign = "center";
    ctx.font = "13px system-ui";
    ctx.fillText("Lava below: " + gap + " m", W / 2, 24);
  }
}

function bindDirection(element, set) {
  element.addEventListener("pointerdown", event => {
    if (state !== "playing") return;
    if (event.pointerType === "mouse" && event.button !== 0) return;

    event.preventDefault();
    set.add(event.pointerId);
    element.setPointerCapture(event.pointerId);
  });

  function release(event) {
    set.delete(event.pointerId);
  }

  element.addEventListener("pointerup", release);
  element.addEventListener("pointercancel", release);
  element.addEventListener("lostpointercapture", release);

  element.addEventListener("contextmenu", event => {
    event.preventDefault();
  });
}

bindDirection($("left"), leftTouches);
bindDirection($("right"), rightTouches);

for (const element of [canvas, $("hook")]) {
  element.addEventListener("pointerdown", event => {
    if (event.pointerType === "mouse" && event.button !== 0) return;
    event.preventDefault();
    hook();
  });

  element.addEventListener("contextmenu", event => {
    event.preventDefault();
  });
}

window.addEventListener("keydown", event => {
  const key = event.key.length === 1
    ? event.key.toLowerCase()
    : event.key;

  if (["ArrowLeft", "ArrowRight", "a", "d"].includes(key)) {
    event.preventDefault();
    if (state === "playing") keyboard.add(key);
  }

  if (event.code === "Space") {
    event.preventDefault();
    if (!event.repeat) hook();
  }

  if (event.code === "KeyP" && !event.repeat) {
    pause();
  }
});

window.addEventListener("keyup", event => {
  keyboard.delete(
    event.key.length === 1
      ? event.key.toLowerCase()
      : event.key
  );
});

window.addEventListener("blur", () => {
  clearInput();
  if (state === "playing") pause();
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden && state === "playing") pause();
});

$("pause").onclick = pause;

panel(
  "GRAPPLE ESCAPE",
  "Hook onto anchors, swing upward, and escape the rising lava. " +
  "Your rope reels you in automatically. Release and hook again " +
  "to reach the next anchor!",
  "Start escape",
  start
);

let previous = performance.now();

function frame(now) {
  const elapsed = Math.min((now - previous) / 1000, 0.05);
  previous = now;

  const steps = Math.max(1, Math.ceil(elapsed / 0.008));
  const dt = elapsed / steps;

  for (let i = 0; i < steps; i++) {
    update(dt);
  }

  hud();
  draw();
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
